name: Publish Site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Rapid pushes (and theme-update + content) otherwise race on gh-pages:
# peaceiris only force-pushes when force_orphan is set, so overlapping
# deploys get "rejected (fetch first)".
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout main branch
      uses: actions/checkout@v3
      with:
        ref: main
        submodules: true
        fetch-depth: 0

    - name: Set up Hugo
      uses: peaceiris/actions-hugo@v2
      with:
        hugo-version: 'latest'

    - name: Build Hugo Site
      run: hugo --minify

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        publish_branch: gh-pages
        publish_dir: ./public
        force_orphan: true
